<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Earning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 15px 90px 15px;
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .balance-card h3 {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .task-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }

        .task-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .task-reward {
            font-size: 13px;
            color: #38bdf8;
        }

        .btn-task {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-task:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .nav-item.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

    <!-- Balance Section -->
    <div class="balance-card">
        <h3>আমার ওয়ালেট ব্যালেন্স</h3>
        <div class="balance-amount"><span id="userBalance">0.00</span> টাকা</div>
    </div>

    <!-- 1. Home Section -->
    <div id="home-section" class="page-section active">
        <div class="section-title">Quick Task Earning এ আপনাকে স্বাগতম</div>
        <div class="task-card">
            <div>
                <div class="task-title">সরাসরি কাজ করুন</div>
                <div class="task-reward">প্রতিদিন আয় করুন</div>
            </div>
            <button class="btn-task" onclick="showSection('tasks-section', this)">কাজ শুরু করুন</button>
        </div>
    </div>

    <!-- 2. Tasks Section -->
    <div id="tasks-section" class="page-section">
        <div class="section-title">দৈনিক টাস্কসমূহ</div>
        
        <div class="task-card">
            <div>
                <div class="task-title">Monetag Ad</div>
                <div class="task-reward">পুরস্কার: ৫ টাকা</div>
            </div>
            <button class="btn-task" onclick="completeTask(this, 'https://example.com', 5)">কাজ করুন</button>
        </div>

        <div class="task-card">
            <div>
                <div class="task-title">Adsterra Ad</div>
                <div class="task-reward">পুরস্কার: ১০ টাকা</div>
            </div>
            <button class="btn-task" onclick="completeTask(this, 'https://example.com', 10)">কাজ করুন</button>
        </div>
    </div>

    <!-- 3. Support Section -->
    <div id="support-section" class="page-section">
        <div class="section-title">হেল্প ও সাপোর্ট</div>
        <div class="task-card">
            <div>
                <div class="task-title">যেকোনো সমস্যার জন্য আমাদের টেলিগ্রাম এ যোগাযোগ করুন।</div>
            </div>
        </div>
    </div>

    <!-- 4. Withdraw Section -->
    <div id="withdraw-section" class="page-section">
        <div class="section-title">টাকা উত্তোলন (Withdraw)</div>
        <div class="task-card" style="display: block;">
            <div class="form-group">
                <label>পেমেন্ট মেথড সিলেক্ট করুন</label>
                <select id="withdrawMethod" class="form-control">
                    <option value="bkash">বিকাশ</option>
                    <option value="nagad">নগদ</option>
                </select>
            </div>
            <div class="form-group">
                <label>অ্যাকাউন্ট নাম্বার</label>
                <input type="text" id="withdrawAccount" class="form-control" placeholder="01XXXXXXXXX">
            </div>
            <div class="form-group">
                <label>পরিমাণ (৫০ - ৩০০০ টাকা)</label>
                <input type="number" id="withdrawAmount" class="form-control" placeholder="পরিমাণ লিখুন">
            </div>
            <button class="btn-submit" onclick="handleWithdraw()">উত্তোলন দিন</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="showSection('home-section', this)">হোম</button>
        <button class="nav-item" onclick="showSection('tasks-section', this)">টাস্ক</button>
        <button class="nav-item" onclick="showSection('support-section', this)">সাপোর্ট</button>
        <button class="nav-item" onclick="showSection('withdraw-section', this)">উইথড্র</button>
    </div>

    <script>
        let currentBalance = 0.00;

        // Section Switcher
        function showSection(sectionId, btnElement) {
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(sectionId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Ad Task Validation with Timer (Ad verification)
        function completeTask(btn, adUrl, rewardAmount) {
            window.open(adUrl, '_blank');
            btn.disabled = true;
            let originalText = btn.innerText;
            let timeLeft = 10;

            let timer = setInterval(() => {
                btn.innerText = `অপেক্ষা করুন... (${timeLeft}s)`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);
                    currentBalance += rewardAmount;
                    document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
                    btn.disabled = false;
                    btn.innerText = originalText;
                    alert(`অভিনন্দন! আপনি ${rewardAmount} টাকা পেয়েছেন।`);
                }
            }, 1000);
        }

        // Withdrawal Handling &amp; Validation
        function handleWithdraw() {
            let method = document.getElementById('withdrawMethod').value;
            let account = document.getElementById('withdrawAccount').value.trim();
            let amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!account || account.length < 11) {
                alert('সঠিক মোবাইল নাম্বার প্রদান করুন!');
                return;
            }

            if (isNaN(amount) || amount < 50 || amount > 3000) {
                alert('সর্বনিম্ন ৫০ টাকা এবং সর্বোচ্চ ৩০০০ টাকা উত্তোলন করতে পারবেন!');
                return;
            }

            if (amount > currentBalance) {
                alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            currentBalance -= amount;
            document.getElementById('userBalance').innerText = currentBalance.toFixed(2);
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('withdrawAccount').value = '';

            alert(`আপনার ${amount} টাকা ${method} এ উত্তোলনের রিকোয়েস্ট সফল হয়েছে।`);
        }
    </script>
</body>
</html>
