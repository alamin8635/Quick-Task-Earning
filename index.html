<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Earning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 15px 90px 15px;
        }

        /* Balance Card Styling */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .balance-card h3 {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        /* Task Card Styling */
        .task-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .task-card:active {
            transform: scale(0.98);
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .task-reward {
            font-size: 13px;
            color: #34d399;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Task Buttons */
        .btn-task {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .btn-task:hover {
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-item.active, .nav-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Balance Section -->
    <div class="balance-card">
        <h3>মোট ব্যালেন্স</h3>
        <div class="balance-amount"><span id="userBalance">0.00</span> পয়সা</div>
    </div>

    <div class="section-title">দৈনিক টাস্কসমূহ</div>

    <!-- Task 1: Monetag -->
    <div class="task-card">
        <div class="task-info">
            <div class="task-title">টাস্ক ১: Monetag Ad</div>
            <div class="task-reward">পুরস্কার: ৪ পয়সা</div>
        </div>
        <button class="btn-task" onclick="completeTask('https://omg10.com/4/11272679', 4)">কাজ করুন</button>
    </div>

    <!-- Task 2: Advertica -->
    <div class="task-card">
        <div class="task-info">
            <div class="task-title">টাস্ক ২: Advertica Ad</div>
            <div class="task-reward">পুরস্কার: ৫ পয়সা</div>
        </div>
        <button class="btn-task" onclick="completeTask('https://data527.click/6a53d7f3ec7d883df750/9f15b129b2/?placementName=default', 5)">কাজ করুন</button>
    </div>

    <!-- Task 3: Adsterra -->
    <div class="task-card">
        <div class="task-info">
            <div class="task-title">টাস্ক ৩: Adsterra Ad</div>
            <div class="task-reward">পুরস্কার: ৬ পয়সা</div>
        </div>
        <button class="btn-task" onclick="completeTask('https://www.profitableratecpmnetwork.com/zppgyhefhv?key=0c986208fb6fc82ccd76ef820b790a51', 6)">কাজ করুন</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item">হোম</button>
        <button class="nav-item">সাপোর্ট</button>
        <button class="nav-item active">টাস্ক</button>
        <button class="nav-item">উইথড্র</button> 
    </div>

    <script>
        let currentBalance = 0;

        function completeTask(adUrl, rewardAmount) {
            // নতুন ট্যাবে অ্যাড ওপেন হবে
            window.open(adUrl, '_blank');

            // ব্যালেন্স আপডেট
            currentBalance += rewardAmount;
            document.getElementById('userBalance').innerText = currentBalance;
            
            alert('টাস্কটি সম্পন্ন করার জন্য ' + rewardAmount + ' পয়সা যোগ করা হয়েছে!');
        }
    </script>
</body>
</html>
