<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Earning</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
        }
        body {
            padding-top: 50px;
            padding-bottom: 70px; /* যাতে নিচের নেভিগেশন বার কন্টেন্ট ঢেকে না ফেলে */
        }
        button#taskBtn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            background-color: #7b2cbf;
            padding: 12px 0;
        }
        .nav-item {
            color: white;
            padding: 0;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Welcome to Quick Task Earning</h1>
    <p>Complete tasks to earn points!</p>
    <button id="taskBtn">Complete Task</button>

    <div class="bottom-nav">
        <button class="nav-item">Home</button>
        <button class="nav-item">Support</button>
        <button class="nav-item">Tasks</button>
        <button class="nav-item">Withdraw</button> 
    </div>
    
    <script>
        document.getElementById('taskBtn').addEventListener('click', function() {
            alert('Task completed! Points will be added to your account.');
        });
    </script>
</body>
</html>
