<!DOCTYPE html>
<html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Earning</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f2f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Quick Task Earning</h1>
    <p>Complete tasks to earn points!</p>
    <button id="taskBtn">Complete Task</button>

    <script>
        document.getElementById('taskBtn').addEventListener('click', function() {
            alert('Task completed! Points will be added to your account.');
        });
    </script>
</body>
</html>
